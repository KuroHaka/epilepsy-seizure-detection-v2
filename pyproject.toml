[project]
name = "epilepsy-seizure-detection"
version = "0.1.0"
description = "Automatic epileptic seizure detection from scalp EEG using the CHB-MIT dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "mne",
    "torch",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "streamlit",
    "openpyxl",
    "ipython",
    "PyQt5",
    "jupyter",
    "ipykernel",
    "ipywidgets",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
